<div class="list row">


<div class="col-md-6">  
    <div class="submit-form">
      <div *ngIf="!submitted">
         
           
        <div class="form-group">
          <label for="title">Codigo</label>
          <input
            type="text"
            class="form-control"
            id="title"
            required
            [(ngModel)]="title"
            name="title"
          />
        </div>
        <div class="form-group">
            <label for="title">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="title"
              required
              [(ngModel)]="nombre"
              name="nombre"
            />
          </div>
  
        <div class="form-group">
          <label for="description">Descripcion</label>
          <input
            class="form-control"
            id="description"
            required
            [(ngModel)]="descripcion"
            name="description"
          />
        </div>
