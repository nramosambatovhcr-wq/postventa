<!-- documento-upload.component.html -->
<div class="upload-container">
    <h3>Subir Nuevo Documento</h3>
    
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="tipoDocumento">Tipo de Documento:</label>
        <select id="tipoDocumento" formControlName="tipoDocumento" class="form-control">
          <option value="">Seleccione un tipo...</option>
          <option *ngFor="let tipo of tiposDocumento" [value]="tipo">{{ tipo }}</option>
        </select>
        <div *ngIf="uploadForm.get('tipoDocumento')?.invalid && uploadForm.get('tipoDocumento')?.touched" class="error-msg">
          Por favor seleccione un tipo de documento.
        </div>
      </div>
      
      <div class="form-group">
        <label for="archivo">Seleccione archivo:</label>
        <input 
          type="file" 
          id="archivo" 
          (change)="onFileSelected($event)" 
          class="form-control-file"
          accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.png">
        <div *ngIf="uploadForm.get('archivo')?.invalid && uploadForm.get('archivo')?.touched" class="error-msg">
          Por favor seleccione un archivo.
        </div>
      </div>
      
      <div *ngIf="selectedFile" class="selected-file">
        Archivo seleccionado: {{ selectedFile.name }}
      </div>
      
      <button type="submit" class="btn-upload" [disabled]="uploadForm.invalid || cargando">
        <span *ngIf="!cargando">Subir Documento</span>
        <span *ngIf="cargando">Subiendo...</span>
      </button>
    </form>
    
    <div *ngIf="progress > 0" class="progress">
      <div class="progress-bar" [style.width.%]="progress">{{ progress }}%</div>
    </div>
    
    <div *ngIf="mensaje" [ngClass]="mensaje.includes('Error') ? 'error-msg' : 'success-msg'">
      {{ mensaje }}
    </div>
  </div>
