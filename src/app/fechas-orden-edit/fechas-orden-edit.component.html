<!-- src/app/components/fechas-orden-edit/fechas-orden-edit.component.html -->
<div class="container">
    <h2 class="heading">Seguimiento de Importación</h2>
    
    <div *ngIf="loading" class="loading-container">
      <div class="spinner"></div>
    </div>
    
    <div *ngIf="!loading" class="fechas-container">
      <form [formGroup]="fechasForm" (ngSubmit)="onSubmit()">
        <div class="seguimiento-panel">
          <div *ngFor="let etapa of etapas" class="etapa-container">
            <div class="fecha-row">
              <div class="fecha-info">
                <h3>{{ etapa.nombre }}</h3>
                <p>{{ etapa.descripcion }}</p>
              </div>
              
              <div class="fecha-input">
                <div class="custom-form-field">
                  <label for="{{etapa.campo}}">Seleccionar fecha</label>
                  <input type="date" [id]="etapa.campo" class="date-input" 
                         [formControlName]="etapa.campo"
                         [readonly]="etapa.bloqueado"
                         (change)="updateFecha(etapa.campo, $event)">
                </div>
              </div>
              
              <div class="estado-container">
                <span class="estado" [ngClass]="fechasForm.get(etapa.campo).value ? 'completado' : 'pendiente'">
                  {{ fechasForm.get(etapa.campo).value ? 'Completado' : 'Pendiente' }}
                </span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="actions">
          <button type="submit" class="btn-primary">Guardar Cambios</button>
          <button type="button" class="btn-secondary" routerLink="/importaciones">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
